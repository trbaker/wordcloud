<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place names, in their own words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #120a1f;
    --ink-2: #1c1130;
    --grid: rgba(255, 122, 26, 0.07);
    --paper: #efe8f7;
    --muted: #a493bf;
    --line: rgba(179, 102, 255, 0.28);
    --sea: #ff7a1a;
    --sand: #e3b96b;
    --coral: #f08a7e;
    --moss: #8cff3f;
    --lilac: #b8a6e6;
    --focus: #ffd166;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  a { color: var(--sea); }

  .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.4rem 1.8rem 1rem;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 0 0 0.35rem;
  }
  .status { color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--moss);
    box-shadow: 0 0 0 0 rgba(140, 255, 63, 0.6);
    animation: pulse 2s infinite;
  }
  .pulse.off { background: var(--muted); animation: none; box-shadow: none; }
  .pulse.err { background: var(--coral); animation: none; box-shadow: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(140, 255, 63, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(140, 255, 63, 0); }
    100% { box-shadow: 0 0 0 0 rgba(140, 255, 63, 0); }
  }
  .delta { color: var(--sand); }

  .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  button, select, input[type="text"], input[type="number"] {
    font: inherit;
    color: var(--paper);
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.45rem 0.75rem;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--sea); color: var(--ink); border-color: var(--sea); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  :is(button, select, input):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .stage { position: relative; min-height: 420px; height: calc(100vh - 110px); }
  @media (max-width: 860px) { .stage { height: 62vh; } }
  canvas#cloud { display: block; width: 100%; height: 100%; cursor: default; }
  .empty {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center; color: var(--muted);
    padding: 2rem; pointer-events: none;
  }
  .empty.hidden { display: none; }
  .empty .big { font-family: var(--font-display); font-size: 1.6rem; color: var(--paper); margin-bottom: 0.4rem; }
  .tooltip {
    position: absolute; pointer-events: none;
    background: var(--paper); color: var(--ink);
    padding: 0.25rem 0.55rem; border-radius: 4px; font-size: 0.85rem;
    transform: translate(-50%, calc(-100% - 10px));
    white-space: nowrap; opacity: 0; transition: opacity 120ms;
  }
  .tooltip.show { opacity: 1; }

  aside {
    border-left: 1px solid var(--line);
    padding: 1.2rem 1.4rem 2rem;
    overflow: auto;
    background: rgba(18, 10, 31, 0.6);
  }
  @media (max-width: 860px) { aside { border-left: 0; border-top: 1px solid var(--line); } }
  aside h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; margin: 1.4rem 0 0.6rem; }
  aside h2:first-child { margin-top: 0; }
  .field { display: grid; gap: 0.3rem; margin-bottom: 0.8rem; }
  .field label { color: var(--muted); font-size: 0.85rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .row > * { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 0.4rem 0.5rem; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--sea); color: var(--ink); font-weight: 600; }

  .entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
  .entry { border-left: 2px solid var(--line); padding: 0.1rem 0 0.1rem 0.75rem; }
  .entry .place { font-family: var(--font-display); font-size: 1.05rem; }
  .entry mark { background: rgba(255, 122, 26, 0.3); color: inherit; padding: 0 0.1em; border-radius: 2px; }
  .entry .when { color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem; }
  .selection { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
  .selection button { padding: 0.15rem 0.5rem; font-size: 0.8rem; }
  .note { color: var(--muted); font-size: 0.85rem; }

  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(20px);
    background: var(--paper); color: var(--ink); padding: 0.55rem 0.9rem; border-radius: 6px;
    font-size: 0.9rem; opacity: 0; transition: opacity 180ms, transform 180ms; pointer-events: none;
    max-width: min(90vw, 40rem); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Shared view: cloud only */
  body.view .actions, body.view aside { display: none; }
  body.view main { grid-template-columns: 1fr; }
  body.view .stage { height: calc(100vh - 100px); }
  body.view canvas#cloud { cursor: default !important; }

  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Place names, in their own words</h1>
      <div class="status">
        <span class="pulse off" id="pulse" aria-hidden="true"></span>
        <span id="statusText">Loading contributions…</span>
        <span class="delta" id="delta"></span>
      </div>
    </div>
    <div class="actions">
      <label class="note" for="interval">Refresh</label>
      <select id="interval" aria-label="Auto-refresh interval">
        <option value="0">manually</option>
        <option value="15000">every 15 s</option>
        <option value="60000" selected>every minute</option>
        <option value="300000">every 5 min</option>
      </select>
      <button class="primary" id="refresh">Refresh now</button>
      <button id="share" title="Copy a link that opens this cloud, with these settings, and nothing else">Share</button>
      <button id="download" title="Save the cloud as a PNG">Save image</button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Word cloud">
      <canvas id="cloud" role="img" aria-label="Word cloud of place-name contributions"></canvas>
      <div class="empty hidden" id="empty">
        <div>
          <div class="big" id="emptyTitle">Nothing to show yet</div>
          <div id="emptyBody">Contributions will appear here as they come in.</div>
        </div>
      </div>
      <div class="tooltip" id="tooltip"></div>
    </section>

    <aside>
      <h2>What to count</h2>
      <div class="field">
        <label>Count as</label>
        <div class="seg" role="group" aria-label="Token mode">
          <button data-mode="words" aria-pressed="true">Single words</button>
          <button data-mode="phrases" aria-pressed="false">Whole place names</button>
        </div>
        <div class="note">Single words counts each word in a place name once. Whole place names counts the full value as one entry.</div>
      </div>
      <div class="row">
        <div class="field">
          <label for="minLen">Shortest word</label>
          <input type="number" id="minLen" min="1" max="10" value="3">
        </div>
        <div class="field">
          <label for="maxWords">Words shown</label>
          <input type="number" id="maxWords" min="10" max="400" step="10" value="120">
        </div>
      </div>
      <div class="field">
        <label for="stop">Also hide these words (comma-separated)</label>
        <input type="text" id="stop" placeholder="e.g. city, state, county">
      </div>

      <h2 class="selection"><span id="listTitle">Latest contributions</span><button id="clearSel" hidden>Show all</button></h2>
      <ul class="entries" id="entries"></ul>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Configuration ---------- */
const SERVICE_URL = "https://services.arcgis.com/BG6nSlhZSAWtExvp/arcgis/rest/services/survey123_60f305b4f73c4317a479dd4ecb18a097_results/FeatureServer";
const LAYER_ID = 0;
const FIELDS = { id: "objectid", place: "place", created: "CreationDate" };
const PAGE_SIZE = 1000;

const DEFAULT_STOPWORDS = new Set(("a an and are as at be because been but by can could did do does for from had has have he her his how i if in into is it its just me my no not of on or our so than that the their them then there these they this to too us was we were what when where which who why will with would you your it's i'm don't").split(" "));

const PALETTE = ["#ff7a1a", "#ffb547", "#b366ff", "#8cff3f", "#e8e3f5", "#ff3b3b"]; // pumpkin, candy corn, witch purple, slime green, ghost, blood
const NEW_COLOR = "#fff36b"; // fresh contributions glow candle-yellow

/* ---------- State ---------- */
const state = {
  features: [],
  mode: "words",
  minLen: 3,
  maxWords: 120,
  extraStop: [],
  counts: new Map(),
  prevCounts: null,
  placed: [],
  selected: null,
  timer: null,
  lastFetch: null,
  anim: null,
  viewOnly: false
};

/* ---------- DOM ---------- */
const $ = (s) => document.querySelector(s);
const canvas = $("#cloud"), ctx = canvas.getContext("2d");
const tooltip = $("#tooltip"), statusText = $("#statusText"), pulse = $("#pulse"), delta = $("#delta");
const entriesEl = $("#entries"), listTitle = $("#listTitle"), clearSel = $("#clearSel");
const emptyEl = $("#empty"), emptyTitle = $("#emptyTitle"), emptyBody = $("#emptyBody");
const toast = $("#toast");

/* ---------- URL parameters (share links) ---------- */
function applyParams() {
  const q = new URLSearchParams(location.search);
  if (q.get("mode") === "phrases" || q.get("mode") === "words") {
    state.mode = q.get("mode");
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === state.mode));
  }
  if (q.has("min")) { state.minLen = Math.max(1, Number(q.get("min")) || 3); $("#minLen").value = state.minLen; }
  if (q.has("max")) { state.maxWords = Math.max(10, Number(q.get("max")) || 120); $("#maxWords").value = state.maxWords; }
  if (q.has("hide")) { $("#stop").value = q.get("hide"); state.extraStop = q.get("hide").toLowerCase().split(",").map(s => s.trim()).filter(Boolean); }
  if (q.has("refresh")) {
    const sel = $("#interval");
    if ([...sel.options].some(o => o.value === q.get("refresh"))) sel.value = q.get("refresh");
  }
  if (q.get("view") === "1") { state.viewOnly = true; document.body.classList.add("view"); }
}

function buildShareUrl() {
  const q = new URLSearchParams();
  q.set("view", "1");
  q.set("mode", state.mode);
  q.set("min", String(state.minLen));
  q.set("max", String(state.maxWords));
  if (state.extraStop.length) q.set("hide", state.extraStop.join(","));
  q.set("refresh", $("#interval").value);
  return `${location.origin}${location.pathname}?${q}`;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove("show"), 2600);
}

$("#share").addEventListener("click", async () => {
  const url = buildShareUrl();
  if (location.protocol === "file:") {
    showToast("Share links need the page to be hosted on a web server; this copy is opened from a local file.");
    await tryCopy(url);
    return;
  }
  const ok = await tryCopy(url);
  showToast(ok ? "Link copied. It opens the cloud with these settings and no controls." : url);
});
async function tryCopy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { window.prompt("Copy this link:", text); return false; }
}

/* ---------- Fetching ---------- */
async function fetchAll() {
  const out = [];
  let offset = 0;
  for (;;) {
    const params = new URLSearchParams({
      where: "1=1",
      outFields: [FIELDS.id, FIELDS.place, FIELDS.created].join(","),
      returnGeometry: "false",
      orderByFields: FIELDS.id + " ASC",
      resultOffset: String(offset),
      resultRecordCount: String(PAGE_SIZE),
      f: "json"
    });
    const res = await fetch(`${SERVICE_URL}/${LAYER_ID}/query?${params}`);
    if (!res.ok) throw new Error(`Service replied ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error.message || "Query failed");
    const feats = (json.features || []).map(f => f.attributes);
    out.push(...feats);
    if (!json.exceededTransferLimit || feats.length === 0) break;
    offset += feats.length;
  }
  return out;
}

async function refresh() {
  setStatus("loading");
  try {
    const feats = await fetchAll();
    const added = state.features.length ? feats.length - state.features.length : 0;
    state.features = feats;
    state.lastFetch = new Date();
    setStatus("ok", added);
    recompute();
  } catch (err) {
    setStatus("error", 0, err.message);
    if (!state.features.length) showEmpty("Couldn’t reach the survey", `${err.message}. Check that the service is public and that you’re online, then refresh.`);
  }
}

function setStatus(kind, added = 0, msg = "") {
  const live = Number($("#interval").value) > 0;
  pulse.className = "pulse " + (kind === "error" ? "err" : (live ? "" : "off"));
  if (kind === "loading") { statusText.textContent = state.features.length ? "Checking for new contributions…" : "Loading contributions…"; return; }
  if (kind === "error") { statusText.textContent = "Couldn’t update: " + msg; return; }
  const n = state.features.length;
  const t = state.lastFetch.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  statusText.textContent = `${n} contribution${n === 1 ? "" : "s"} · updated ${t}${live ? " · live" : ""}`;
  delta.textContent = added > 0 ? `+${added} since last check` : "";
}

/* ---------- Tokenizing ---------- */
function normalizePhrase(s) {
  return s.trim().replace(/\s+/g, " ").replace(/[.\s,;]+$/g, "");
}
function tokenizeWords(s) {
  return s.toLowerCase()
    .replace(/[’]/g, "'")
    .split(/[^a-z0-9'\u00c0-\u024f-]+/i)
    .map(w => w.replace(/^['-]+|['-]+$/g, ""))
    .filter(Boolean);
}
function placeOf(rec) { return (rec[FIELDS.place] || "").toString(); }

function recompute() {
  const stop = new Set([...DEFAULT_STOPWORDS, ...state.extraStop]);
  const counts = new Map();
  for (const rec of state.features) {
    const place = placeOf(rec);
    if (!place.trim()) continue;
    const seen = new Set();
    if (state.mode === "phrases") {
      seen.add(normalizePhrase(place));
    } else {
      for (const w of tokenizeWords(place)) if (w.length >= state.minLen && !stop.has(w)) seen.add(w);
    }
    for (const t of seen) counts.set(t, (counts.get(t) || 0) + 1);
  }
  state.counts = counts;
  layoutAndDraw();
  renderEntries();
  state.prevCounts = counts;
}

/* ---------- Layout (Archimedean spiral, rect collision) ---------- */
function layoutAndDraw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const list = [...state.counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, state.maxWords);
  if (!list.length) {
    state.placed = [];
    ctx.clearRect(0, 0, W, H);
    if (state.features.length) showEmpty("Nothing to show yet", "Every word was filtered out. Lower the shortest-word setting or clear the hidden-words list.");
    else showEmpty("Nothing to show yet", "Contributions will appear here as they come in.");
    return;
  }
  emptyEl.classList.add("hidden");

  const max = list[0][1], min = list[list.length - 1][1];
  const area = W * H;
  const maxFont = Math.max(28, Math.min(H * 0.22, Math.sqrt(area) / 6));
  const minFont = Math.max(11, maxFont * 0.16);
  const scale = (c) => min === max ? maxFont * 0.7 : minFont + (maxFont - minFont) * Math.sqrt((c - min) / (max - min));
  const family = getComputedStyle(document.documentElement).getPropertyValue("--font-display");

  const placed = [];
  const pad = 3;
  const overlaps = (r) => {
    if (r.x < 0 || r.y < 0 || r.x + r.w > W || r.y + r.h > H) return true;
    for (const p of placed) {
      if (r.x < p.x + p.w + pad && r.x + r.w + pad > p.x && r.y < p.y + p.h + pad && r.y + r.h + pad > p.y) return true;
    }
    return false;
  };

  let seed = 7;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  list.forEach(([text, count], i) => {
    const size = scale(count);
    ctx.font = `500 ${size}px ${family}`;
    const tw = ctx.measureText(text).width, th = size * 1.05;
    const rotate = i > 0 && text.length <= 12 && rand() < 0.22;
    const w = rotate ? th : tw, h = rotate ? tw : th;

    const cx = W / 2, cy = H / 2;
    const a0 = rand() * Math.PI * 2;
    let found = null;
    for (let t = 0; t < 4000; t++) {
      const r = 2.2 * Math.sqrt(t) * 1.6;
      const ang = a0 + t * 0.35;
      const x = cx + r * Math.cos(ang) * (W / H) - w / 2;
      const y = cy + r * Math.sin(ang) - h / 2;
      const rect = { x, y, w, h };
      if (!overlaps(rect)) { found = rect; break; }
    }
    if (!found) return;
    const isNew = !!(state.prevCounts && state.prevCounts.size > 0 && (state.prevCounts.get(text) || 0) < count);
    placed.push({ ...found, text, count, size, rotate, color: isNew ? NEW_COLOR : PALETTE[i % PALETTE.length], isNew });
  });

  state.placed = placed;
  animateDraw(W, H);
}

function drawWords(W, H, progress = 1) {
  ctx.clearRect(0, 0, W, H);
  const family = getComputedStyle(document.documentElement).getPropertyValue("--font-display");
  const n = state.placed.length;
  state.placed.forEach((p, i) => {
    const t = Math.min(1, Math.max(0, (progress * (n + 6) - i) / 6));
    if (t <= 0) return;
    ctx.save();
    ctx.globalAlpha = t;
    const dim = state.selected && state.selected !== p.text;
    ctx.fillStyle = dim ? "rgba(164,147,191,0.3)" : p.color;
    ctx.font = `500 ${p.size}px ${family}`;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    if (p.rotate) ctx.rotate(-Math.PI / 2);
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  });
}

function animateDraw(W, H) {
  if (state.anim) cancelAnimationFrame(state.anim);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { drawWords(W, H, 1); return; }
  const start = performance.now(), dur = 900;
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur);
    drawWords(W, H, p);
    if (p < 1) state.anim = requestAnimationFrame(step);
  };
  state.anim = requestAnimationFrame(step);
}

function showEmpty(title, body) {
  emptyTitle.textContent = title; emptyBody.textContent = body;
  emptyEl.classList.remove("hidden");
}

/* ---------- Hit testing ---------- */
function hitAt(evt) {
  const r = canvas.getBoundingClientRect();
  const x = evt.clientX - r.left, y = evt.clientY - r.top;
  return state.placed.find(p => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) || null;
}
canvas.addEventListener("mousemove", (e) => {
  const hit = hitAt(e);
  canvas.style.cursor = hit && !state.viewOnly ? "pointer" : "default";
  if (hit) {
    tooltip.textContent = `${hit.text} — ${hit.count} contribution${hit.count === 1 ? "" : "s"}${hit.isNew ? " · new" : ""}`;
    tooltip.style.left = (hit.x + hit.w / 2) + "px";
    tooltip.style.top = hit.y + "px";
    tooltip.classList.add("show");
  } else tooltip.classList.remove("show");
});
canvas.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
canvas.addEventListener("click", (e) => {
  if (state.viewOnly) return;
  const hit = hitAt(e);
  state.selected = hit ? (state.selected === hit.text ? null : hit.text) : null;
  drawWords(canvas.clientWidth, canvas.clientHeight, 1);
  renderEntries();
});

/* ---------- Entries list ---------- */
function matches(rec, token) {
  const place = placeOf(rec);
  if (state.mode === "phrases") return normalizePhrase(place) === token;
  return tokenizeWords(place).includes(token.toLowerCase());
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function highlight(text, token) {
  if (!token) return escapeHtml(text);
  const esc = token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return escapeHtml(text).replace(new RegExp(`(${esc})`, "ig"), "<mark>$1</mark>");
}

function renderEntries() {
  if (state.viewOnly) return;
  const sel = state.selected;
  let recs = [...state.features].sort((a, b) => (b[FIELDS.created] || 0) - (a[FIELDS.created] || 0));
  if (sel) recs = recs.filter(r => matches(r, sel));
  else recs = recs.slice(0, 8);
  listTitle.textContent = sel ? `“${sel}” · ${recs.length} contribution${recs.length === 1 ? "" : "s"}` : "Latest contributions";
  clearSel.hidden = !sel;
  entriesEl.innerHTML = recs.map(r => {
    const place = placeOf(r);
    const when = r[FIELDS.created] ? new Date(r[FIELDS.created]).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) : "";
    return `<li class="entry">
      <div class="place">${highlight(place || "(no place given)", sel)}</div>
      ${when ? `<div class="when">${when}</div>` : ""}
    </li>`;
  }).join("") || `<li class="note">No contributions match.</li>`;
}
clearSel.addEventListener("click", () => { state.selected = null; drawWords(canvas.clientWidth, canvas.clientHeight, 1); renderEntries(); });

/* ---------- Controls ---------- */
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  state.mode = b.dataset.mode; state.selected = null; recompute();
}));
$("#minLen").addEventListener("change", (e) => { state.minLen = Math.max(1, Number(e.target.value) || 1); recompute(); });
$("#maxWords").addEventListener("change", (e) => { state.maxWords = Math.max(10, Number(e.target.value) || 120); recompute(); });
let stopTimer;
$("#stop").addEventListener("input", (e) => {
  clearTimeout(stopTimer);
  stopTimer = setTimeout(() => {
    state.extraStop = e.target.value.toLowerCase().split(",").map(s => s.trim()).filter(Boolean);
    recompute();
  }, 350);
});
$("#refresh").addEventListener("click", refresh);
$("#interval").addEventListener("change", scheduleRefresh);
$("#download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "place-names-wordcloud.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});

function scheduleRefresh() {
  clearInterval(state.timer);
  const ms = Number($("#interval").value);
  if (ms > 0) state.timer = setInterval(refresh, ms);
  if (state.lastFetch) setStatus("ok");
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { const pc = state.prevCounts; state.prevCounts = null; layoutAndDraw(); state.prevCounts = pc; }, 150);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && Number($("#interval").value) > 0) refresh(); });

/* ---------- Go ---------- */
applyParams();
document.fonts.ready.then(() => { refresh(); scheduleRefresh(); });
</script>
</body>
</html>
